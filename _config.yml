# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Regularized low-rank approximations.
author: Jeremy E. Cohen
logo: Figures/cube_on_dico_page.png

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force # cache
  timeout: 600  # Increase timeout for long-running notebooks
  allow_errors: true

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - all_refs.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/cohenjer/HDR
  #path_to_book: manuscript  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
#html:
#  use_issues_button: true
#  use_repository_button: true


# Using latex-like math in markdown cells
# NUMBERING CAN BE DONE NATIVELY
# See https://jupyterbook.org/content/math.html

sphinx:
  config:
    #latex_logo: Figures/cube_on_dico_page.png
    latex_domain_indices: false
    numfig: true
    numfig_format:
      theorem: "Theorem %s"
      lemma: "Lemma %s"
      axiom: "Axiom %s"
      proof: "Proof %s"
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    html_js_files:
    - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    latex_elements:
      preamble: |
        \usepackage{stmaryrd}
        \usepackage{graphicx}
        
        % Center Sphinx images globally (including non-figure images)
        \let\origSphinxincludegraphics\sphinxincludegraphics
        \renewcommand{\sphinxincludegraphics}[2][]{\makebox[\linewidth][c]{\origSphinxincludegraphics[#1]{#2}}}
        
        % Custom math commands
        \newcommand{\argmin}[1]{\underset{#1}{\text{argmin}}~}
        \newcommand{\argmax}[1]{\underset{#1}{\text{argmax}}~}
        \providecommand{\amin}[1]{\underset{#1}{\text{min}}~}
        \providecommand{\R}[1]{\mathbb{R}^{#1}}
        \renewcommand{\vec}[1]{\text{vec}\left(#1\right)}
        \providecommand{\KL}[1]{\mathcal{D}_{\text{KL}}\left(#1\right)}
        \providecommand{\cp}[1]{\text{col}_{+}\left(#1\right)}
        \providecommand{\rank}[1]{\text{rank}\left(#1\right)}
      sphinxsetup: |
        div.topic_border-width=1pt,
        div.topic_border-TeXcolor={RGB}{120,120,120},
        div.topic_background-TeXcolor={RGB}{245,245,245},
        div.topic_padding=7pt,
        div.topic_box-shadow=none,
        div.note_border-width=1pt,
        div.note_border-TeXcolor={RGB}{40,90,180},
        div.note_background-TeXcolor={RGB}{235,242,255},
        div.hint_border-width=1pt,
        div.hint_border-TeXcolor={RGB}{30,140,85},
        div.hint_background-TeXcolor={RGB}{232,248,238},
        div.important_border-width=1pt,
        div.important_border-TeXcolor={RGB}{120,85,40},
        div.important_background-TeXcolor={RGB}{252,244,228},
        div.tip_border-width=1pt,
        div.tip_border-TeXcolor={RGB}{30,140,85},
        div.tip_background-TeXcolor={RGB}{232,248,238},
        div.warning_border-width=1pt,
        div.warning_border-TeXcolor={RGB}{180,120,0},
        div.warning_background-TeXcolor={RGB}{255,245,214},
        div.caution_border-width=1pt,
        div.caution_border-TeXcolor={RGB}{170,70,0},
        div.caution_background-TeXcolor={RGB}{255,235,217},
        div.attention_border-width=1pt,
        div.attention_border-TeXcolor={RGB}{170,70,0},
        div.attention_background-TeXcolor={RGB}{255,235,217},
        div.danger_border-width=1pt,
        div.danger_border-TeXcolor={RGB}{170,35,35},
        div.danger_background-TeXcolor={RGB}{255,232,232},
        div.error_border-width=1pt,
        div.error_border-TeXcolor={RGB}{150,20,20},
        div.error_background-TeXcolor={RGB}{255,225,225}
    # Configure references
    bibtex_reference_style: author_year
    #bibtex_reference_style: label
    mathjax3_config:
      tex:
        #packages: {'[+]': ['ams']}  # Load AMS extensions
        macros:
          "llbracket": ["⟦"]
          "rrbracket": ["⟧"]
          "argmin": ["\\underset{#1}{\\text{argmin}}~",1]
          "argmax": ["\\underset{#1}{\\text{argmax}}~",1]
          "amin": ["\\underset{#1}{\\text{min}}~",1]
          "R": ["\\mathbb{R}^{#1}",1]
          "vec": ["\\text{vec}\\left(#1\\right)",1]
          "KL": ["\\mathcal{D}_{\\text{KL}}\\left(#1\\right)",1]
          "cp": ["\\text{col}_{+}\\left(#1\\right)",1]
          "rank": ["\\text{rank}\\left(#1\\right)",1]
  extra_extensions:
    - sphinx_proof

html:
  use_repository_button: true
  # Use Hypothesis for book reviews
  comments:
    hypothesis: true

# Make the cells runable online??
launch_buttons:
  thebe: true
  notebook_interface: "classic" # jupyterlab"  # or "classic"
  binderhub_url: "https://mybinder.org"  # The URL for your BinderHub (e.g., https://mybinder.org)