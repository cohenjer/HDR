project:
  type: default
  output-dir: _site

execute:
  echo: false
  warning: false

format:
  revealjs:
    theme: default
    center: false
    code-copy: true
    controls: true
    css: styles.css
    incremental: false
    progress: true
    slide-number: c/t
    transition: fade

    include-in-header:
      - text: |
          <nav id="section-nav" aria-label="Section navigation"></nav>

    include-after-body:
      - js/nav.js