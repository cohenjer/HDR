project:
  type: default
  output-dir: _site
  resources:
    - js/nav.js

execute:
  echo: false
  warning: false

format:
  revealjs:
    theme: default
    center: false
    code-copy: true
    controls: true
    css: styles.css
    incremental: false
    progress: false
    slide-number: c/t
    transition: fade

    include-in-header:
      - text: |
          <nav id="section-nav" aria-label="Section navigation"></nav>
      - text: |
          <script src="js/nav.js"></script>